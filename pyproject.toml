[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-exploration-ppo"
version = "0.1.0"
description = "Foundation contracts for high-resolution lunar frontier PPO exploration."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "path-planner==0.1.0",
  "pydantic>=2.7,<3",
  "rasterio>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lunar_exploration_ppo*"]
